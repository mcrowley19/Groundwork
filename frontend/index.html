<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groundwork</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 1600'%3E%3Crect width='1600' height='1600' rx='320' fill='%23F7F7F7'/%3E%3Cpath d='M288 1152H1312Q1344 1152 1344 1120V736Q1344 722 1333 712L821 264Q800 248 779 264L267 712Q256 722 256 736V1120Q256 1152 288 1152Z' fill='%23FFFFFF' stroke='%23E3E6EA' stroke-width='16'/%3E%3Crect x='192' y='1248' width='1216' height='144' rx='72' fill='%237EC6F9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"></script>
<style>
:root {
  --bg: #0A0E14; --panel: #10161F; --border: #1E2733; --grid: #18202B;
  --text: #E6EDF3; --text-2: #8B98A8; --muted: #56636F;
  --accent: #3FD0E0; --accent-dim: rgba(63,208,224,.14);
  --nominal: #3FB68B; --watch: #E3B341; --critical: #E5534B; --added: #FF453A;
  --water: #2F81F7; --transport: #9B8CFF; --schools: #F0B85A;
  --stop: #F778BA; --rail: #C9D1D9;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  /* Uppercase tracked labels: Plex Sans Condensed keeps the instrument-panel feel without mono's width. */
  --label: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  /* Weights follow IBM Carbon guidance for Plex: Regular for text, values and controls;
     SemiBold for headers, names and key figures. No Medium, so each step reads as deliberate. */
  --w-reg: 400; --w-semi: 600;
  --r: 4px; --ease: cubic-bezier(.2,.7,.3,1);
  --kpi-h: 88px; --bottom-h: 150px; --left-w: 360px; --right-w: 380px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
body { font: 13px/1.35 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.mono, .num, td.num, .kpi-value, .readout, code, .ts, .id { font-family: var(--mono); font-variant-numeric: tabular-nums; }
b, strong { font-weight: var(--w-semi); }
button, input { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #243040; }
::-webkit-scrollbar-track { background: transparent; }

/* ---- app grid --------------------------------------------------------- */
#app { display: grid; height: 100vh; width: 100vw; gap: 1px; background: var(--border);
  grid-template-rows: var(--kpi-h) minmax(0,1fr) var(--bottom-h);
  grid-template-columns: minmax(0,1fr);
  grid-template-areas: "kpi" "mid" "bottom"; }
#kpis { grid-area: kpi; } #mid { grid-area: mid; } #bottom { grid-area: bottom; }
#mid { position: relative; min-height: 0; --l-off: var(--left-w); --r-off: var(--right-w); --handle: 22px; }
#mid.l-closed { --l-off: var(--handle); } #mid.r-closed { --r-off: var(--handle); }
#map-wrap { position: absolute; inset: 0; }
#left, #right { position: absolute; top: 0; bottom: 0; z-index: 6; display: flex; flex-direction: column; gap: 1px; background: rgba(30,39,51,.6);
  transition: transform 220ms var(--ease); }
#left { left: 0; width: var(--left-w); border-right: 1px solid var(--border); }
#right { right: 0; width: var(--right-w); border-left: 1px solid var(--border); }
#mid.l-closed #left { transform: translateX(calc(-1 * var(--left-w))); }
#mid.r-closed #right { transform: translateX(var(--right-w)); }
/* frosted glass: the map shows through the side columns */
#left .panel, #right .panel { background: rgba(16,22,31,.68); backdrop-filter: blur(14px) saturate(130%); -webkit-backdrop-filter: blur(14px) saturate(130%); }
#left .state, #right .state, #left thead th, #right thead th { background: rgba(16,22,31,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#left thead th, #right thead th { background: rgba(16,22,31,.96); }   /* sticky header: rows scrolling under it shouldn't read through */
#left tbody tr:hover td, #right .alert:hover { background: rgba(230,237,243,.05); }
.handle { position: absolute; top: 50%; width: var(--handle); height: 72px; transform: translateY(-50%); z-index: 7; display: flex; align-items: center; justify-content: center;
  background: rgba(16,22,31,.85); border: 1px solid var(--border); color: var(--text-2); font: var(--w-reg) 10px/1 var(--mono); cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.handle:hover { color: var(--accent); border-color: var(--accent); }
.handle span { display: block; writing-mode: vertical-rl; letter-spacing: .14em; text-transform: uppercase; font-size: 9px; color: var(--muted); margin-top: 6px; font-family: var(--label); }
#left .handle { right: calc(-1 * var(--handle) - 1px); border-left: 0; } #right .handle { left: calc(-1 * var(--handle) - 1px); border-right: 0; }
#bottom { display: grid; grid-template-columns: 272px minmax(0,1fr); gap: 1px; background: var(--border); min-height: 0; }

/* ---- panels ----------------------------------------------------------- */
.panel { position: relative; background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.ph { display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 14px; border-bottom: 1px solid var(--border); flex: none; gap: 8px; }
.ph h2 { font: var(--w-semi) 11px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.ph .meta { font: var(--w-reg) 10px/1 var(--label); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto; }
.ph .close { font: var(--w-reg) 10px/1 var(--mono); letter-spacing: .12em; color: var(--text-2); flex: none; }
.ph .close:hover { color: var(--accent); }
.ph .close[hidden] { display: none; }
.pb { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.pb.scroll { overflow-y: auto; }
.state { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 6px; background: var(--panel); z-index: 4; text-align: center; padding: 12px; }
.state.on { display: flex; }
.state .code { font: var(--w-semi) 11px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); }
.state .hint { font: var(--w-reg) 11px/1.4 var(--sans); color: var(--muted); max-width: 250px; }
.state.error .code { color: var(--critical); }
.state.loading .code::after { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--accent); margin-left: 8px; vertical-align: 1px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---- boot ------------------------------------------------------------- */
.boot .panel, .boot .kpi { opacity: 0; transform: translateY(4px); }
.panel, .kpi { transition: opacity 220ms var(--ease), transform 220ms var(--ease); }
.booted .panel, .booted .kpi { opacity: 1; transform: none; }

/* ---- top bar ---------------------------------------------------------- */
.src { display: flex; align-items: center; gap: 5px; font: var(--w-reg) 9px/1 var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.tag { margin-left: 12px; font: var(--w-semi) 10px/1 var(--mono); letter-spacing: .14em; padding: 5px 8px; border: 1px solid var(--watch); color: var(--watch); white-space: nowrap; }

/* ---- KPI strip -------------------------------------------------------- */
#kpis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px; background: var(--border); }
.kpi { background: var(--panel); padding: 10px 14px 8px; display: flex; flex-direction: column; justify-content: space-between; position: relative; min-width: 0; }
.kpi .lbl { font: var(--w-reg) 9px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .lbl b { color: var(--muted); font-weight: var(--w-reg); margin-right: 6px; }
.kpi .lbl i { display: inline-block; width: 6px; height: 6px; margin-right: 6px; vertical-align: 0; }
.kpi-value { font-size: 24px; line-height: 1; font-weight: var(--w-reg); letter-spacing: -.01em; white-space: nowrap; margin: 6px 0 4px; }
@media (max-width: 1440px) { .kpi-value { font-size: 19px; } }   /* eight KPIs; €10,148,500 overflows its cell at 24px */
.kpi-value .unit { font-size: 12px; color: var(--text-2); margin-left: 4px; font-weight: var(--w-reg); }
.kpi .sub { font: var(--w-reg) 10px/1 var(--mono); color: var(--muted); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .sub.up { color: var(--added); }
.kpi.flash::after, tr.flash td, .alert.flash { animation: flash 420ms var(--ease); }
@keyframes flash { 0% { background-color: var(--accent-dim); } 100% { background-color: transparent; } }
.kpi.flash::after { content: ""; position: absolute; inset: 0; pointer-events: none; }

/* ---- priority table --------------------------------------------------- */
table { width: 100%; border-collapse: collapse; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--panel); font: var(--w-semi) 9px/1 var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 8px 6px 7px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
thead th:first-child, tbody td:first-child { padding-left: 14px; }
thead th:last-child, tbody td:last-child { padding-right: 14px; }
thead th.sorted { color: var(--text); }
thead th.sorted::after { content: " ▾"; font-size: 9px; } thead th.sorted.asc::after { content: " ▴"; }
thead th.r, td.r { text-align: right; }
thead th.c, td.c { text-align: center; }
tbody tr { cursor: pointer; border-bottom: 1px solid var(--grid); }
tbody tr:hover td { background: #141b25; }
tbody tr.sel td { background: var(--accent-dim); }
tbody tr.sel td:first-child, tbody tr.hl td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
tbody tr.off { opacity: .4; }
td { padding: 7px 5px; vertical-align: middle; font-size: 12px; white-space: nowrap; }
#tbl th, #tbl td { padding-left: 4px; padding-right: 4px; }   /* five columns inside the 360px panel */
#tbl th:first-child, #tbl td:first-child { padding-left: 14px; } #tbl th:last-child, #tbl td:last-child { padding-right: 10px; }
td .nm { display: block; font-weight: var(--w-semi); max-width: 106px; overflow: hidden; text-overflow: ellipsis; font-size: 11px; font-family: var(--mono); }
td .id { display: block; font-size: 10px; color: var(--muted); letter-spacing: .02em; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-flex; align-items: center; gap: 4px; font: var(--w-reg) 8px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; padding: 4px 4px; border: 1px solid; border-radius: var(--r); white-space: nowrap; }
.badge::before { content: ""; width: 5px; height: 5px; background: currentColor; }
.badge.nominal { color: var(--nominal); border-color: rgba(63,182,139,.45); }
.badge.watch { color: var(--watch); border-color: rgba(227,179,65,.45); }
.badge.critical { color: var(--critical); border-color: rgba(229,83,75,.45); }
.badge.none, .badge.granted, .badge.pending { color: var(--text-2); border-color: var(--border); }
.badge.pending { border-style: dashed; }
.badge.added { color: var(--added); border-color: rgba(255,69,58,.5); }
.badge.granted::before { background: var(--text-2); } .badge.pending::before { background: transparent; border: 1px solid var(--text-2); width: 3px; height: 3px; }
.sub3 { display: inline-flex; flex-direction: column; gap: 2px; vertical-align: middle; }
.sub3 .b { width: 30px; height: 4px; background: var(--grid); position: relative; }
.sub3 .b i { position: absolute; left: 0; top: 0; bottom: 0; transition: width 200ms var(--ease); }
.sub3 .b.w i { background: var(--water); } .sub3 .b.t i { background: var(--transport); } .sub3 .b.s i { background: var(--schools); }
.ov-score { display: inline-flex; align-items: center; gap: 6px; }
.ov-score .bar { display: inline-block; width: 26px; height: 6px; background: var(--grid); position: relative; }
.ov-score .bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width 200ms var(--ease); }
.ov-score.nominal .bar i { background: var(--nominal); } .ov-score.watch .bar i { background: var(--watch); } .ov-score.critical .bar i { background: var(--critical); }
.ov-score .pv { font-family: var(--mono); font-size: 11px; color: var(--text); width: 20px; text-align: right; }

/* ---- charts ----------------------------------------------------------- */
.chart { position: absolute; inset: 0; }
.chart svg { display: block; width: 100%; height: 100%; }
.chart text { font-family: var(--mono); font-size: 9px; fill: var(--muted); letter-spacing: .04em; }
.chart .axis line, .chart .axis path { stroke: var(--grid); }
.chart .axis .domain { display: none; }
.chart .grid line { stroke: var(--grid); }
.chart .bin { stroke: var(--panel); stroke-width: 1; fill-opacity: .75; cursor: pointer; }
.chart .bin:hover { fill-opacity: 1; }
.chart .bin.nominal { fill: var(--nominal); } .chart .bin.watch { fill: var(--watch); } .chart .bin.critical { fill: var(--critical); }
.chart .marker line { stroke: var(--accent); stroke-width: 1.5; }
.chart .marker text { fill: var(--accent); }
.chart-foot { position: absolute; left: 14px; bottom: 6px; font: var(--w-reg) 9px/1 var(--mono); letter-spacing: .06em; color: var(--muted); z-index: 2; }

/* ---- inspector -------------------------------------------------------- */
.detail { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 9px; }
.detail a[data-k] { color: inherit; text-decoration: underline dotted var(--muted); text-underline-offset: 2px; cursor: pointer; }
.detail a[data-k]:hover { color: var(--accent); }
.detail .alert { margin: 0 -14px; }
.detail .alert:last-child { border-bottom: 0; }
.sec { display: flex; flex-direction: column; }
.sh { display: flex; justify-content: space-between; gap: 8px; font: var(--w-semi) 9px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 2px 0 6px; border-bottom: 1px solid var(--grid); }
.sh span:last-child { color: var(--text-2); letter-spacing: .04em; text-transform: none; white-space: nowrap; }
.detail a.rel { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--grid); font: var(--w-reg) 10.5px/1 var(--mono); color: var(--text-2); text-decoration: none; }
.detail a.rel:hover { color: var(--text); background: rgba(230,237,243,.04); }
.rel .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.rel .num { flex: none; color: var(--text-2); }
.rel .badge { flex: none; }
.ev { font: var(--w-reg) 10px/1.5 var(--mono); color: var(--text-2); padding: 3px 0; border-bottom: 1px solid var(--grid); white-space: normal; }
.feed-note { padding: 8px 14px; font: var(--w-reg) 10px/1.4 var(--mono); color: var(--muted); border-bottom: 1px solid var(--grid); }
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.d-head .nm { font: var(--w-semi) 14px/1.2 var(--mono); overflow-wrap: anywhere; }
.d-head .id { font-size: 10px; color: var(--muted); margin-top: 3px; letter-spacing: .04em; font-family: var(--sans); }
.d-head .badges { display: flex; gap: 4px; flex: none; }
.d-desc { font-size: 11px; line-height: 1.4; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.d-desc a { color: var(--accent); text-decoration: none; } .d-desc a:hover { text-decoration: underline; }
.d-row { display: flex; gap: 14px; font: var(--w-reg) 10px/1 var(--mono); color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.d-row span b { color: var(--text); font-weight: var(--w-reg); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--grid); border: 1px solid var(--grid); }
.card { background: var(--panel); padding: 7px 8px 8px; min-width: 0; border-top: 2px solid var(--muted); }
.card.water { border-top-color: var(--water); } .card.transport { border-top-color: var(--transport); } .card.schools { border-top-color: var(--schools); }
.card .ch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.card .ch .t { font: var(--w-semi) 9px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); }
.card .ch .sc { font: var(--w-semi) 12px/1 var(--mono); }
.card .ch .sc.nominal { color: var(--nominal); } .card .ch .sc.watch { color: var(--watch); } .card .ch .sc.critical { color: var(--critical); }
.kv { display: flex; justify-content: space-between; gap: 6px; font: var(--w-reg) 9.5px/1.8 var(--mono); color: var(--muted); white-space: nowrap; }
.kv span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kv b { color: var(--text); font-weight: var(--w-reg); flex: none; }
.est { color: var(--text-2); cursor: help; margin-right: 2px; font-weight: var(--w-reg); border-bottom: 1px dotted var(--muted); }

/* ---- alerts ----------------------------------------------------------- */
.alert { display: grid; grid-template-columns: 4px 1fr; gap: 0 10px; padding: 7px 14px 7px 10px; border-bottom: 1px solid var(--grid); cursor: pointer; }
.alert:hover { background: #141b25; }
.alert.sel { background: var(--accent-dim); }
.alert i { background: var(--muted); }
.alert.critical i { background: var(--critical); } .alert.watch i { background: var(--watch); } .alert.info i { background: var(--text-2); }
.alert .h { display: flex; justify-content: space-between; gap: 8px; font: var(--w-semi) 10px/1 var(--label); letter-spacing: .1em; text-transform: uppercase; }
.alert.critical .h b { color: var(--critical); } .alert.watch .h b { color: var(--watch); } .alert.info .h b { color: var(--text-2); }
.alert .h span { color: var(--muted); font-weight: var(--w-reg); letter-spacing: .04em; }
.alert .h span i { display: inline-block; width: 6px; height: 6px; margin-left: 6px; vertical-align: 0; }
.alert .t { font-size: 12px; margin-top: 3px; color: var(--text); line-height: 1.35; white-space: normal; }
.alert .t .num { color: var(--text); }

/* ---- scenario --------------------------------------------------------- */
#scenario-body { height: 100%; padding: 4px 14px 10px; }
.sc-ctl { height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--border); }
.seg button { font: var(--w-reg) 10px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; padding: 7px 12px; color: var(--text-2); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { color: var(--text); background: rgba(230,237,243,.04); }
.seg button.on { background: var(--accent); color: var(--bg); }
.presets { display: grid; grid-template-columns: repeat(2, 1fr); }
/* per-plan approval toggles (inspector) */
.appr { flex: none; display: inline-flex; align-items: center; gap: 6px; font: var(--w-reg) 9px/1 var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); border: 1px dashed var(--border); padding: 4px 7px; cursor: pointer; }
.appr i { width: 8px; height: 8px; border: 1px solid var(--text-2); flex: none; }
.appr:hover { color: var(--text); border-color: var(--text-2); }
.appr.on { color: var(--added); border: 1px solid rgba(255,69,58,.5); }
.appr.on i { background: var(--added); border-color: var(--added); }
.appr.lg { width: 100%; justify-content: center; gap: 10px; font: var(--w-semi) 12px/1 var(--label); letter-spacing: .12em; padding: 13px 14px; color: #0A0E14; background: var(--accent); border: 1px solid var(--accent); border-radius: var(--r); box-shadow: 0 0 0 1px rgba(63,208,224,.25), 0 4px 18px rgba(63,208,224,.25); transition: filter 120ms, box-shadow 120ms; }
.appr.lg i { width: 11px; height: 11px; border: 1.5px solid #0A0E14; border-radius: 2px; }
.appr.lg:hover { color: #0A0E14; border-color: var(--accent); filter: brightness(1.1); box-shadow: 0 0 0 1px rgba(63,208,224,.4), 0 6px 24px rgba(63,208,224,.4); }
.appr.lg.on { color: var(--added); background: rgba(255,69,58,.1); border: 1px solid var(--added); box-shadow: none; }
.appr.lg.on i { background: var(--added); border-color: var(--added); }
.appr.lg.on:hover { filter: none; background: rgba(255,69,58,.18); }
.d-appr:has(.appr.lg) { flex-direction: column; align-items: stretch; gap: 9px; padding: 10px 0 12px; }
.d-appr { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--grid); border-bottom: 1px solid var(--grid); font: var(--w-reg) 10px/1.35 var(--mono); color: var(--muted); }
.pend { padding: 8px 14px 10px; border-bottom: 1px solid var(--grid); }
.pend .sh a { color: var(--text-2); text-decoration: none; cursor: pointer; } .pend .sh a:hover { color: var(--text); }

.sub3 .b, .sub3 .b i, .ov-score .bar, .ov-score .bar i, .alert i, .kpi .lbl i, .alert .h span i, .sw .sysdot, #systems button i, .badge::before, .lg i.sq, .lg i.sw- { border-radius: 2px; }

<script>
'use strict';
/* =====================================================================
   Infrastructure Impact Monitor — Dublin region (prototype)
   Single-file dashboard over the pipeline outputs in /data.
   Water network is INFERRED from public evidence; transport and school
   figures are prototype estimates driven by assumptions.json.
   ===================================================================== */

// ---- formatting ---------------------------------------------------------
const nf0 = new Intl.NumberFormat('en-IE', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('en-IE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('en-IE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const isNum = v => typeof v === 'number' && !isNaN(v);
const fmtInt = v => isNum(v) ? nf0.format(Math.round(v)) : '—';
const fmtEur = v => isNum(v) ? '€' + nf0.format(Math.round(v)) : '—';
const fmtKm  = m => isNum(m) ? nf1.format(m / 1000) : '—';
const fmtKm1 = km => isNum(km) ? nf1.format(km) : '—';
const fmtPct = v => isNum(v) ? nf1.format(v) + '%' : '—';
const fmtM   = v => isNum(v) ? (v >= 1000 ? nf1.format(v / 1000) + ' km' : nf0.format(Math.round(v)) + ' m') : '—';
const fmtRatio = v => isNum(v) ? nf2.format(v) : '—';
const pad2 = n => String(n).padStart(2, '0');
const utcStamp = d => `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

// ---- constants ----------------------------------------------------------
const THRESH = { critical: 65, watch: 35 };
const SYSTEMS = ['all', 'water', 'transport', 'schools'];
const SYS_COLOR = { water: [47, 129, 247], transport: [155, 140, 255], schools: [240, 184, 90] };
const SYS_HEX = { water: '#2F81F7', transport: '#9B8CFF', schools: '#F0B85A' };
const STOP_COLOR = [247, 120, 186], RAIL_COLOR = [201, 209, 217];
const LAYER_HEX = { stops: '#F778BA', rail: '#C9D1D9' };
const STATUS_COLORS = { nominal: [63, 182, 139], watch: [227, 179, 65], critical: [229, 83, 75], none: [86, 99, 111] };
const ACCENT = [63, 208, 224];
const ADDED = [255, 69, 58];          // infrastructure that only exists if pending applications are approved
const DUBLIN = { center: [-6.2603, 53.3498], zoom: 11.2, pitch: 50, bearing: -15 };
const statusOf = p => !isNum(p) ? 'none' : p >= THRESH.critical ? 'critical' : p >= THRESH.watch ? 'watch' : 'nominal';
function normStatus(s) {
  s = String(s || '').toLowerCase();
  if (/grant|permit|approv|conditional/.test(s)) return 'granted';
  if (/refus|withdraw|invalid/.test(s)) return 'excluded';
  return 'pending';
}

// ---- state --------------------------------------------------------------
const S = {
  raw: {}, errors: {}, status: null,
  scenario: { mode: 'baseline', approved: new Set(), ver: 0 },   // approved: app_ids of pending plans switched on in the inspector
  system: 'all',
  devs: [], routes: [], stops: [], schools: [], rails: [], exts: [], assumptions: new Map(),
  byId: new Map(), routeById: new Map(), stopById: new Map(), schoolById: new Map(),
  rows: [], kpis: null, baselineKpis: null, alerts: [],
  selected: null, selectedRoute: null, picked: null, highlight: new Set(), highlightRoutes: new Set(),
  sort: { k: 'overall', asc: false },
  layers: { adds: false, devs: true, net: false, stops: false, rail: false, routes: false, schools: false },
  netLoading: false, booted: false,
};

// ---- geometry helpers ---------------------------------------------------
function geomBounds(g, b = [Infinity, Infinity, -Infinity, -Infinity]) {
  const walk = c => (typeof c[0] === 'number')
    ? (b[0] = Math.min(b[0], c[0]), b[1] = Math.min(b[1], c[1]), b[2] = Math.max(b[2], c[0]), b[3] = Math.max(b[3], c[1]))
    : c.forEach(walk);
  if (g && g.coordinates) walk(g.coordinates);
  return b;
}
function centroidOf(g) {
  const b = geomBounds(g);
  return isFinite(b[0]) ? [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2] : [NaN, NaN];
}
function squareAround([lon, lat], units) {
  const side = Math.sqrt(Math.max(units, 10) * 90);            // m, same 90 m²/unit as the mock generator
  const dLat = side / 2 / 111320, dLon = side / 2 / (111320 * Math.cos(lat * Math.PI / 180));
  return { type: 'Polygon', coordinates: [[[lon - dLon, lat - dLat], [lon + dLon, lat - dLat], [lon + dLon, lat + dLat], [lon - dLon, lat + dLat], [lon - dLon, lat - dLat]]] };
}
function distM(a, b) {
  const R = 6371000, dLat = (b[1] - a[1]) * Math.PI / 180, dLon = (b[0] - a[0]) * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * Math.PI / 180) * Math.cos(b[1] * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function pathLengthM(coords) { let t = 0; for (let i = 1; i < coords.length; i++) t += distM(coords[i - 1], coords[i]); return t; }
function geomLengthM(g) { if (!g) return 0; return g.type === 'LineString' ? pathLengthM(g.coordinates) : g.type === 'MultiLineString' ? d3.sum(g.coordinates, pathLengthM) : 0; }

// ---- data loading -------------------------------------------------------
async function fetchJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url.split('/').pop()} ${r.status}`);
  return r.json();
}
const FILES = { devs: 'developments.geojson', exts: 'extensions.geojson', stops: 'stops.geojson', rails: 'rail_lines.geojson',
                routes: 'transport_routes.geojson', schools: 'schools.geojson', assumptions: 'assumptions.json', summary: 'summary.json' };
async function loadAll() {
  const jobs = Object.entries(FILES).map(async ([k, f]) => {
    try { S.raw[k] = await fetchJson('/data/' + f); } catch (e) { S.errors[k] = e.message; S.raw[k] = null; }
  });
  jobs.push((async () => { try { S.status = await fetchJson('/api/status'); } catch (e) { S.status = null; } })());
  await Promise.all(jobs);
  prepare();
}
async function loadNetwork() {           // the real network file can be tens of MB: fetched only when toggled on
  if (S.raw.net || S.netLoading) return;
  S.netLoading = true; renderLayerControl();
  try { S.raw.net = await fetchJson('/data/network.geojson'); }
  catch (e) { S.errors.net = e.message; S.raw.net = { type: 'FeatureCollection', features: [] }; }
  S.netById = new Map((S.raw.net.features || []).map(f => [String(f.properties?.edge_id), f]));
  S.netLoading = false; renderLayerControl(); renderLegend(); renderMap();
}

// ---- static preparation (once) -----------------------------------------
function prepare() {
  const feats = k => S.raw[k]?.features || [];
  S.assumptions = new Map((Array.isArray(S.raw.assumptions) ? S.raw.assumptions : []).map(a => [a.key, a]));
  S.stops = feats('stops').map(f => ({ id: String(f.properties.stop_id), name: f.properties.name || 'Bus stop', pt: f.geometry?.coordinates,
    freq: +f.properties.peak_buses_per_hr || 0, routes: f.properties.routes || [] })).filter(s => s.pt);
  S.stopById = new Map(S.stops.map(s => [s.id, s]));
  S.schools = feats('schools').map(f => ({ id: String(f.properties.school_id), name: f.properties.name || 'School', level: f.properties.level || 'primary',
    pt: f.geometry?.type === 'Point' ? f.geometry.coordinates : centroidOf(f.geometry), enrolment: +f.properties.enrolment || 0,
    newPupils: +f.properties.projected_new_pupils || 0, ratio: +f.properties.pressure_ratio || 0 }));
  S.schoolById = new Map(S.schools.map(s => [s.id, s]));
  S.rails = feats('rails').map(f => ({ id: String(f.properties.id), mode: f.geometry?.type === 'Point' ? 'station' : (f.properties.mode || 'rail'), name: f.properties.name || '', geom: f.geometry }));
  S.railById = new Map(S.rails.map(r => [r.id, r]));
  S.devs = feats('devs').map(f => {
    const p = f.properties || {}, w = p.water || {}, t = p.transport || {}, sc = p.schools || {}, scores = p.scores || {};
    const centroid = p.centroid || (f.geometry?.type === 'Point' ? f.geometry.coordinates : centroidOf(f.geometry));

const freqThreshold = () => S.assumptions.get('frequent_bus')?.value ?? S.assumptions.get('FREQ_THRESHOLD')?.value ?? 6;

  const sr = S.assumptions.get('school_secondary_radius')?.value ?? S.assumptions.get('POSTPRIMARY_RADIUS_M')?.value ?? 3000;

// ---- scenario computation (client-side, live) ---------------------------
function weightOf(d, sc = S.scenario) {

}
function computeScenario(sc) {

  const active = rows.filter(r => r.weight > 0);
  const sum = (arr, f) => d3.sum(arr, r => { const v = f(r); return isNum(v) ? v * r.weight : 0; });
  const activeRoutes = S.routes.filter(r => r.serves.some(id => (S.byId.get(id) && weightOf(S.byId.get(id), sc) > 0)));
  const kpis = {
    units: sum(rows, r => r.units), residents: sum(rows, r => r.transport.residents), trips: sum(rows, r => r.transport.trips),
    routes: activeRoutes.length, buses: d3.sum(activeRoutes, r => r.buses),
    pupilsP: sum(rows, r => r.schools.primary), pupilsS: sum(rows, r => r.schools.secondary),
    ext_m: sum(rows, r => r.water.connected ? 0 : r.water.route), cost: sum(rows, r => r.water.connected ? 0 : r.water.cost),
    critical: active.filter(r => statusOf(r.scores.overall) === 'critical').length, activeCount: active.length,
  };
  kpis.pupils = kpis.pupilsP + kpis.pupilsS;
  return { rows, kpis, activeRoutes };
}
function recompute() {

  S.rows = cur.rows; S.kpis = cur.kpis; S.baselineKpis = base.kpis; S.activeRouteIds = new Set(cur.activeRoutes.map(r => r.id));
  S.rowById = new Map(S.rows.map(r => [r.id, r]));
  S.activeRows = S.rows.filter(r => r.weight > 0);
  // infrastructure that exists only because of pending applications: shown in red on the map
  const w = id => S.rowById.get(id)?.weight ?? 0, isPending = id => S.byId.get(id)?.status === 'pending';
  const tag = (items, add, hide) => { for (const it of items) {
    if (!it.serves.length) continue;
    if (!it.serves.some(id => w(id) > 0)) hide.add(it.id);
    else if (!it.serves.some(id => w(id) > 0 && !isPending(id))) add.add(it.id);
  } };

}
function sysScore(r, sys = S.system) { return sys === 'all' ? r.scores.overall : r.scores[sys]; }

function buildAlerts() {
  const out = [];
  const push = (sev, sys, id, title, text, score) => out.push({ sev, sys, rank: { critical: 0, watch: 1, info: 2 }[sev], score, id, title, text });
  for (const r of S.rows) {
    if (r.weight <= 0) continue;
    const u = fmtInt(r.units), t = r.transport, w = r.water, s = r.schools;
    if (t.cls === 'unserved' && !t.routeId) push('critical', 'transport', r.id, `critical — ${r.id}`, `<span class="num">${u}</span> units, nearest frequent stop <span class="num">${fmtM(t.fstop)}</span>, no proposed route.`, r.units + 1000);
    else if (t.cls === 'unserved' || t.cls === 'weak') { const route = S.routeById.get(t.routeId); push(route ? 'watch' : 'critical', 'transport', r.id, `${route ? 'watch' : 'critical'} — ${r.id}`, `<span class="num">${u}</span> units, nearest frequent stop <span class="num">${fmtM(t.fstop)}</span>${route ? `; proposed route ${route.id} needs <span class="num">${route.buses}</span> buses (${fmtKm1(route.km)} km)` : '; no proposed route'}.`, r.units + 500); }
    if (w.connected === false && isNum(w.route) && w.route > 500) push('critical', 'water', r.id, `critical — ${r.id}`, `<span class="num">${u}</span> units <span class="num">${fmtM(w.dist)}</span> from the inferred network: <span class="num">${fmtM(w.route)}</span> of new ${w.bore ? w.bore + ' mm ' : ''}main ≈ <span class="num">${fmtEur(w.cost)}</span>.`, r.units + 400);
    else if (w.connected === false && isNum(w.route) && w.route > 150) push('watch', 'water', r.id, `watch — ${r.id}`, `<span class="num">${u}</span> units need <span class="num">${fmtM(w.route)}</span> of new main ≈ <span class="num">${fmtEur(w.cost)}</span>.`, r.units + 200);
    if (s.flag === 'critical') push('critical', 'schools', r.id, `critical — ${r.id}`, s.nearP === 0 ? `<span class="num">${u}</span> units with no primary school within catchment; ≈<span class="num">${fmtInt(s.primary)}</span> primary pupils.` : `≈<span class="num">${fmtInt(s.primary)}</span> primary + <span class="num">${fmtInt(s.secondary)}</span> secondary pupils; worst nearby school at <span class="num">${fmtRatio(s.worst)}</span>× capacity.`, r.units + 300);
    else if (s.flag === 'watch') push('watch', 'schools', r.id, `watch — ${r.id}`, `≈<span class="num">${fmtInt(s.primary + s.secondary)}</span> new pupils; nearby schools at <span class="num">${fmtRatio(s.worst)}</span>× capacity${s.nearS === 0 ? ', no secondary school in catchment' : ''}.`, r.units + 100);
  }
  const src = S.raw.summary?.sources || {};

  for (const [k, e] of Object.entries(S.errors)) if (k !== 'net') push('critical', null, null, `data — ${FILES[k] || k}`, `File unavailable: ${esc(e)}. Panels depending on it show empty states.`, 1e9);

}

// ---- animated numbers ----------------------------------------------------
const tweens = new Map();
function tweenNumber(el, to, fmt, dur = 220) {
  const from = tweens.get(el)?.value ?? (S.booted ? to : 0);
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = from + (to - from) * e;
    tweens.set(el, { value: v }); el.textContent = fmt(v);
    if (k < 1) requestAnimationFrame(step); else tweens.set(el, { value: to });
  };
  requestAnimationFrame(step);
}

}
const prevKpi = {};
function renderKpis() {

function logEntry(html, cls = '') {
  const log = $('#query-log'); const el = document.createElement('div'); el.className = 'q-entry ' + cls; el.innerHTML = html; log.appendChild(el); log.scrollTop = log.scrollHeight; return el;
}
async function ask(q) {
  const ts = utcStamp(new Date()) + 'Z';
  const el = logEntry(`<div><span class="ts">${ts}</span><span class="q">&gt; ${esc(q)}</span></div><div class="a"></div>`, 'pending');
  const context = { scenario: { mode: S.scenario.mode, approved_app_ids: [...S.scenario.approved] },
    developments: S.rows.map(r => ({ app_id: r.id, num_units: r.units, status: r.status, weight: r.weight, address: r.address, overall: +(r.scores.overall ?? 0).toFixed(1),
      overall_status: statusOf(r.scores.overall), water_score: r.scores.water, transport_score: r.scores.transport ?? 0, schools_score: r.scores.schools ?? 0,
      water_connected: r.water.connected, water_route_m: r.water.route, water_cost: r.water.cost, transport_class: r.transport.cls, nearest_frequent_stop_m: r.transport.fstop,
      nearest_rail_m: r.transport.railM, peak_pt_trips: r.transport.trips, route_id: r.transport.routeId, primary_pupils: r.schools.primary ?? 0, secondary_pupils: r.schools.secondary ?? 0, schools_flag: r.schools.flag })),
    routes: S.routes.map(r => ({ route_id: r.id, length_km: r.km, round_trip_min: r.rt, headway_min: r.headway, buses_required: r.buses, serves_app_ids: r.serves, peak_demand: r.demand })) };
  try {
    const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q, context }) });
    if (!r.ok) throw new Error(`/api/ask ${r.status}`);
    const j = await r.json();
    const ids = [...new Set((j.highlight_app_ids || []).map(String))].filter(id => S.byId.has(id));
    const rids = [...new Set((j.highlight_route_ids || []).map(String))].filter(id => S.routeById.has(id));
    el.classList.remove('pending');
    $('.a', el).innerHTML = esc(j.answer) +
      (ids.length || rids.length ? `<div class="chips">${ids.map(id => `<button data-id="${esc(id)}">${esc(id)}</button>`).join('')}${rids.map(id => `<button class="route" data-route="${esc(id)}">${esc(id)}</button>`).join('')}</div>` : '');
    if (j.warning) $('.a', el).insertAdjacentHTML('beforeend', `<div class="eng">${esc(j.warning)}</div>`);
    setHighlight(ids, rids, true);
  } catch (e) {
    el.classList.remove('pending'); el.classList.add('err'); $('.a', el).textContent = `error — ${e.message}`;
  }
  $('#query-log').scrollTop = $('#query-log').scrollHeight;
}

    const dim = S.selectedRoute ? S.selectedRoute !== r.id : S.selected ? !r.serves.includes(S.selected) : false;

function hoverRoute(i) {
  if (!i.object) return hideTip(); const r = i.object, [x, y] = tipAt(i);
  showTip(x, y, `<div class="tt-h">${esc(r.id)} · proposed route</div>${row('to', esc(r.to || '—'))}${row('length', fmtKm1(r.km) + ' km')}${row('round trip ≈', fmtInt(r.rt) + ' min')}${row('buses ≈', fmtInt(r.buses))}${row('serves', r.serves.join(', '))}${row('path', esc(r.pathSource))}${S.addedRouteIds?.has(r.id) ? row('needed for', '<span style="color:var(--added)">pending sites only</span>') : ''}`);
}
function hoverExt(i) {
  if (!i.object) return hideTip(); const e = i.object, [x, y] = tipAt(i);
  showTip(x, y, `<div class="tt-h">New main · ${esc(e.street || e.id)}</div>${row('order', e.order)}${row('length', fmtM(e.length))}${row('bore', e.bore ? e.bore + ' mm' : '—')}${row('serves', e.serves.join(', ') || '—')}${row('est. cost ≈', fmtEur(e.cost))}${S.addedExtIds?.has(e.id) ? row('needed for', '<span style="color:var(--added)">pending sites only</span>') : ''}`);
}
function hoverNet(i) {
  if (!i.object) return hideTip(); const p = i.object.properties, [x, y] = tipAt(i);
  showTip(x, y, `<div class="tt-h">${esc(p.street_name || p.edge_id)}</div>${row('confidence', esc(p.confidence))}${row('length', fmtM(p.length_m))}<div class="desc">${esc((p.evidence || []).slice(0, 3).join(' · ') || 'no evidence')}</div>`);
}

// ---- system switcher, layer control, legend ------------------------------
function renderSystems() {
  $('#systems').innerHTML = SYSTEMS.map((s, i) => `<button type="button" data-s="${s}" class="${S.system === s ? 'on' : ''}">${s === 'all' ? '' : `<i style="background:${SYS_HEX[s]}"></i>`}${s}<kbd>${i + 1}</kbd></button>`).join('');
}
const LAYER_DEFS = [['adds', 'Scenario adds', 'added'], ['devs', 'Developments', null], ['net', 'Network', 'water'], ['stops', 'Stops', 'transport'], ['rail', 'Rail', 'transport'], ['routes', 'Routes', 'transport'], ['schools', 'Schools', 'schools']];
function renderLayerControl() {
  const host = $('#layers'); for (const el of $$('.sw', host)) el.remove();
  host.insertAdjacentHTML('beforeend', LAYER_DEFS.filter(([k, l, s]) => !s || s === 'added' || S.system === 'all' || S.system === s).map(([k, l, s]) =>
    `<div class="sw ${S.layers[k] ? 'on' : ''}${k === 'net' && S.netLoading ? ' busy' : ''}" data-k="${k}"><span>${s ? `<i class="sysdot" style="background:${LAYER_HEX[k] || SYS_HEX[s] || 'var(--added)'}"></i>` : ''}${l}</span><span class="k"></span></div>`).join(''));
}
function toggleLayer(k) { S.layers[k] = !S.layers[k]; if (k === 'net' && S.layers.net && !S.raw.net) loadNetwork(); renderLayerControl(); renderLegend(); renderMap(); syncBusLoop(); }
function renderLegend() {
  const src = () => '';
  const show = s => S.system === 'all' || S.system === s;
  const rows = [
    `<div class="lg"><i class="sw-" style="background:linear-gradient(90deg,#3FB68B 0 33%,#E3B341 33% 66%,#E5534B 66%)"></i><span class="lb">nominal · watch · critical</span>${src(false)}</div>`,
    `<div class="lg"><i class="sq" style="background:#8B98A8"></i><span class="lb">granted · height = units</span>${src(true)}</div>`,
    `<div class="lg"><i class="sq" style="background:rgba(139,152,168,.4);outline:1px dashed #8B98A8;outline-offset:-1px"></i><span class="lb">pending</span>${src(true)}</div>`,
  ];
  if (show('water') && S.layers.adds) rows.push(`<div class="lg"><i class="ln" style="border-color:#2F81F7"></i><span class="lb">new water main</span>${src(false)}</div>`);
  if (show('water')) rows.push(`<div class="lg"><i class="ln dash" style="border-color:#2F81F7;opacity:.7"></i><span class="lb">est. network</span>${src(false)}</div>`);
  if (show('transport')) rows.push(`<div class="lg"><i class="dot" style="background:#F778BA"></i><span class="lb">bus stop</span>${src(false)}</div>`,
    `<div class="lg"><i class="ln" style="border-color:#C9D1D9"></i><span class="lb">Luas · rail dashed</span>${src(false)}</div>`,
    `<div class="lg"><i class="ln" style="border-color:#9B8CFF;border-top-width:3px"></i><span class="lb">proposed bus route</span>${src(false)}</div>`);
  if (show('schools')) rows.push(`<div class="lg"><i class="dot" style="background:#F0B85A;box-shadow:0 0 0 3px rgba(229,83,75,.35)"></i><span class="lb">school · halo = capacity</span>${src(false)}</div>`);
  if (S.layers.adds && S.scenario.approved.size > 0) rows.unshift(`<div class="lg"><i class="ln" style="border-color:#FF453A;border-top-width:3px;box-shadow:0 0 6px rgba(255,69,58,.7)"></i><span class="lb">added if pending approved</span></div>`);
  rows.push(`<div class="lg"><span class="nd">Planning status is official. Everything else is estimated; the water network is inferred from public data, not Uisce Éireann records.</span></div>`);
  $('#legend-rows').innerHTML = rows.join('');
}

// ---- selection + linked updates -----------------------------------------
const safe = fn => { try { fn(); } catch (e) { console.error('[panel]', fn.name, e); } };
function renderAll() { [renderKpis, renderTable, renderHist, renderInspector, renderScenario, renderLayerControl, renderLegend, renderSystems, renderMap, syncBusLoop].forEach(safe); }
function renderSelection() { S.busTrips = null; [renderTable, renderHist, renderInspector, renderMap].forEach(safe); }

function select(id, source) {
  if (id && !S.byId.has(id)) return;
  const changed = id !== S.selected;
  S.selected = id; S.selectedRoute = null; S.picked = null;
  if (id) openSide('r');
  if (changed && id) startReveal(); else { clearInterval(revealTimer); revealOrder = Infinity; }
  renderSelection();
  const d = S.byId.get(id);
  if (d && changed) flyToDev(d);
  const tr = $(`#tbl tr[data-id="${CSS.escape(id || '')}"]`); if (tr && source !== 'table') tr.scrollIntoView({ block: 'nearest' });
}
function selectRoute(id) {
  const r = S.routeById.get(id); if (!r) return;
  S.selected = null; S.selectedRoute = id; S.picked = null; clearInterval(revealTimer); revealOrder = Infinity;
  openSide('r');
  renderSelection();
  fitTo(r.bounds, { maxZoom: 14.5 });
}
// anything on the map that isn't a development or a route: stops, schools, new-main segments, network edges, rail
const PICK = { stop: id => S.stopById.get(id), school: id => S.schoolById.get(id), ext: id => S.extById.get(id), net: id => S.netById?.get(id), rail: id => S.railById.get(id) };
function pickBounds(p) {
  const o = p.obj;
  if (p.kind === 'stop' || p.kind === 'school') return [o.pt[0], o.pt[1], o.pt[0], o.pt[1]];
  if (p.kind === 'ext') return geomBounds({ coordinates: o.path });
  if (p.kind === 'net') return geomBounds(o.geometry);
  if (p.kind === 'rail') return geomBounds(o.geom);
  return null;
}
function pick(kind, id, source) {
  const obj = PICK[kind]?.(String(id)); if (!obj) return;
  S.selected = null; S.selectedRoute = null; clearInterval(revealTimer); revealOrder = Infinity;
  S.picked = { kind, id: String(id), obj };
  openSide('r');
  renderSelection();
  if (source !== 'map') { const b = pickBounds(S.picked); if (b) fitTo(b, { maxZoom: kind === 'rail' && obj.mode !== 'station' ? 12.5 : 15.5, duration: 900 }); }
}
function goTo(kind, id, source) { if (kind === 'dev') select(id, source); else if (kind === 'route') selectRoute(id); else pick(kind, id, source); }
function clearSelection() { if (S.selected || S.selectedRoute || S.picked || S.highlight.size || S.highlightRoutes.size) { S.selected = null; S.selectedRoute = null; S.picked = null; S.highlight.clear(); S.highlightRoutes.clear(); clearInterval(revealTimer); revealOrder = Infinity; renderSelection(); } }
function setHighlight(ids, rids, fit) {
  S.highlight = new Set(ids); S.highlightRoutes = new Set(rids || []);
  renderTable(); renderMap();
  if (fit && (ids.length || (rids || []).length)) {
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    for (const id of ids) b = geomBounds(S.byId.get(id).geom, b);
    for (const id of rids || []) { const r = S.routeById.get(id); b = [Math.min(b[0], r.bounds[0]), Math.min(b[1], r.bounds[1]), Math.max(b[2], r.bounds[2]), Math.max(b[3], r.bounds[3])]; }
    fitTo(b, { maxZoom: ids.length + (rids || []).length === 1 ? 15 : 13.5, duration: 1000 });
  }
}
function setSystem(s) {
  if (!SYSTEMS.includes(s) || s === S.system) return;
  S.system = s; renderSystems(); renderLayerControl(); renderLegend(); renderTable(); renderHist(); renderInspector(); renderMap(); syncBusLoop();
}
function applyScenario() { recompute(); renderKpis(); renderTable(); renderHist(); renderInspector(); renderScenario(); renderLegend(); renderMap(); }

// ---- events -------------------------------------------------------------
function bindEvents() {
  $('#tbl thead').addEventListener('click', e => { const th = e.target.closest('th'); if (!th) return; const k = th.dataset.k; S.sort = S.sort.k === k ? { k, asc: !S.sort.asc } : { k, asc: k === 'name' || k === 'status' }; renderTable(); });
  $('#tbl tbody').addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) select(tr.dataset.id === S.selected ? null : tr.dataset.id, 'table'); });
  $('#insp-body').addEventListener('click', e => {
    const ap = e.target.closest('[data-approve]'); if (ap) { e.preventDefault(); return toggleApproved(ap.dataset.approve); }
    const all = e.target.closest('[data-approve-all]'); if (all) { e.preventDefault(); return setApproved(all.dataset.approveAll === '1' ? pendingDevs().map(d => d.id) : []); }
    const a = e.target.closest('[data-k]'); if (!a || !a.dataset.id) return; e.preventDefault(); goTo(a.dataset.k, a.dataset.id, 'inspector'); });
  $('#insp-close').addEventListener('click', () => clearSelection());
  $('#query-log').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) return select(b.dataset.id, 'query'); const r = e.target.closest('button[data-route]'); if (r) selectRoute(r.dataset.route); });
  $('#presets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setApproved(b.dataset.all === '1' ? pendingDevs().map(d => d.id) : []); });
  $('#systems').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSystem(b.dataset.s); });
  $('#layers').addEventListener('click', e => { const sw = e.target.closest('.sw'); if (sw) toggleLayer(sw.dataset.k); });
  $('#h-left').addEventListener('click', () => toggleSide('l'));
  $('#h-right').addEventListener('click', () => toggleSide('r'));
  $('#btn-reset').addEventListener('click', () => resetCamera(900));
  $('#btn-close').addEventListener('click', () => toggleDrawer(false));
  $('#query-form').addEventListener('submit', e => { e.preventDefault(); const q = $('#query').value.trim(); if (!q) return; $('#query').value = ''; ask(q); });
  document.addEventListener('keydown', e => {
    const inInput = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
    if (e.key === 'Escape') { if ($('#drawer').classList.contains('on')) toggleDrawer(false); else { clearSelection(); hideTip(); } if (inInput) document.activeElement.blur(); return; }
    if (inInput) return;
    if (e.key === '/') { e.preventDefault(); $('#query').focus(); return; }
    if (e.key === 'r' || e.key === 'R') { resetCamera(900); clearSelection(); return; }
    if (e.key === '[') { toggleSide('l'); return; }
    if (e.key === ']') { toggleSide('r'); return; }
    if (/^[1-4]$/.test(e.key)) { setSystem(SYSTEMS[+e.key - 1]); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); const rows = $$('#tbl tbody tr'); if (!rows.length) return;
      const i = rows.findIndex(r => r.dataset.id === S.selected); const n = e.key === 'ArrowDown' ? Math.min(rows.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
      select(rows[n].dataset.id, 'table');
    }
  });
  const ro = new ResizeObserver(() => { renderHist(); if (map) map.resize(); });
  ro.observe($('#hist')); ro.observe($('#mid'));
}

// ---- boot ---------------------------------------------------------------
function bootSequence() {
  const order = ['#kpis', '#left > .panel:nth-child(1)', '#map-wrap', '#right > .panel', '#left > .panel:nth-child(2)', '#bottom > .panel:nth-child(1)', '#bottom > .panel:nth-child(2)'];
  document.body.classList.remove('boot');
  order.forEach((sel, i) => setTimeout(() => { for (const el of $$(sel)) { el.style.opacity = 1; el.style.transform = 'none'; } if (sel === '#kpis') for (const k of $$('.kpi')) { k.style.opacity = 1; k.style.transform = 'none'; } }, 120 + i * 150));
  setTimeout(() => { S.booted = true; renderKpis(); }, 700);
  setTimeout(() => { resetCamera(2200); }, 300);
  setTimeout(() => { document.body.classList.add('booted'); }, 2100);
}

async function main() {
  decoratePanels(); buildKpis(); renderSystems(); renderLayerControl(); renderLegend(); restoreSides();
  setAllStates('loading', 'Loading');
  initMap(); bindEvents();
  await loadAll();
  buildKpis(); recompute(); renderDrawer();
  if (!S.raw.devs && !S.raw.summary) setAllStates('error', 'Data unavailable', 'No pipeline outputs could be loaded from /data. Check the server log.');
  renderAll();
  bootSequence();
  $('#query-meta').textContent = S.status?.llm_configured ? '' : 'offline rules';
}
main().catch(err => { console.error(err); setAllStates('error', 'Dashboard failed to start', String(err.message || err)); });

</script>
